plugins {
    id 'com.android.application'
}

android {
    namespace 'com.routine.watch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.routine.watch'
        minSdk 26          // Android 8.0 and newer (the Fire-Boltt Dream is Android 8.1)
        targetSdk 27       // behaves like Android 8.1, the watch's own version
        versionCode 3
        versionName '1.2'
    }

    // one fixed key, so a new APK installs OVER the old one (GitHub would otherwise make a new random key every build)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
